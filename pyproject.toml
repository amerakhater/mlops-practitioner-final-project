[project]
name = "mlops-final-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.157.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
mlops-final-project = "prodllm:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The distribution is still named "mlops-final-project", so the backend would
# otherwise look for a src/mlops_final_project/ module.
module-name = "prodllm"
