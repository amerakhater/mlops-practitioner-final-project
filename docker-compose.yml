# docker compose up --build
#
# Brings the service up on http://localhost:8000. Compose is not ceremony
# here: the next module adds a vector database and a tracing backend as
# sibling services, and this file is where they attach, so `docker compose up`
# stays the one command that brings the whole stack up.

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    image: amerakhater/mlops-final-project:0.1.0
    ports:
      - "8000:8000"
    environment:
      # DEBUG additionally emits one per-call latency line per embed and per
      # retrieval, from the @log_latency decorator.
      PRODLLM_LOG_LEVEL: INFO
      # One thread per worker: scale with replicas, not in-process threads, so
      # per-container memory and latency stay predictable.
      PRODLLM_TORCH_NUM_THREADS: "1"
      PRODLLM_TOP_K: "5"
    # Mirrors the image's own HEALTHCHECK so `docker compose ps` reports
    # readiness rather than mere liveness: /health answers 200 while degraded
    # on purpose, so a 200 does not mean the service can answer questions.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,sys,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)); sys.exit(0 if d['model_loaded'] and d['documents_indexed'] > 0 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # The development container, behind a profile so `docker compose up` still
  # means "run the service as it ships":
  #   docker compose --profile dev up dev                   # reload on edit
  #   docker compose --profile dev run --rm dev pytest      # the suite
  #   docker compose --profile dev run --rm dev ruff check .
  #
  # Port 8001 belongs to api-thin, so this takes 8002 and all three can run at
  # once -- comparing dev behaviour against the shipped image is the reason to
  # have both.
  dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    image: mlops-final-project:0.1.0-dev
    ports:
      - "8002:8000"
    # The dev image bakes no PRODLLM_* values -- tests/test_config.py asserts
    # the shipped defaults, so they are set here instead, where a run can
    # override them. DEBUG adds the per-call @log_latency lines.
    environment:
      PRODLLM_ARTIFACTS_DIR: /app/artifacts
      PRODLLM_LOG_LEVEL: DEBUG
      PRODLLM_TORCH_NUM_THREADS: "1"
      PRODLLM_TOP_K: "5"
    volumes:
      # Source, tests and scripts are mounted rather than baked, so an edit on
      # the host is what runs -- `uvicorn --reload` restarts, and pytest sees
      # the current tree with no rebuild.
      - ./src:/app/src
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./openapi.json:/app/openapi.json:ro
      # Read-only: the dev container reuses the index and weights already built
      # on the host, and cannot corrupt them. If artifacts/ is empty the model
      # is downloaded instead, into the cache volume below.
      - ./artifacts:/app/artifacts:ro
      - hf-cache-dev:/app/.cache/huggingface
    # The dev image does not have the runtime's HEALTHCHECK, on purpose: a dev
    # container is routinely started with no index on purpose.

  # The weightless variant, for the report's image-size comparison:
  #   docker compose --profile thin up --build api-thin
  # It downloads ~470 MB on first start, so the cache is a named volume --
  # without one, every restart downloads the model again.
  api-thin:
    profiles: ["thin"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime-thin
    image: amerakhater/mlops-final-project:0.1.0-thin
    ports:
      - "8001:8000"
    environment:
      PRODLLM_LOG_LEVEL: INFO
      PRODLLM_TORCH_NUM_THREADS: "1"
    volumes:
      - hf-cache:/app/.cache/huggingface
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,sys,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)); sys.exit(0 if d['model_loaded'] and d['documents_indexed'] > 0 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 600s
      retries: 3
    restart: unless-stopped

  # The MLflow tracking server, behind a profile so `docker compose up` still
  # means "run the service as it ships":
  #
  #   docker compose --profile tracking up -d mlflow     # UI on :5000
  #
  # Experiment tracking is developer and CI infrastructure, not part of the
  # product: the API container neither talks to it nor knows it exists, so the
  # tracking server being down can never take an answer request with it.
  #
  # SQLite rather than files for the backend store because the Model Registry
  # requires a database-backed store -- with a plain ./mlruns directory,
  # `mlflow.register_model` fails with INVALID_PARAMETER_VALUE and the
  # registry half of this module is simply unavailable.
  #
  # --serve-artifacts proxies artifact upload and download through the server,
  # so a client writes to mlflow-artifacts:/ and never needs a path that
  # happens to resolve on both the host and inside this container.
  mlflow:
    profiles: ["tracking"]
    image: ghcr.io/mlflow/mlflow:v3.17.2
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
    volumes:
      - mlflow-store:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3); sys.exit(0)"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  # ------------------------------------------------- Module 3: the Bento
  #
  #   UV_INDEX_STRATEGY=unsafe-best-match uv run --group serving bentoml build
  #   uv run --group serving bentoml containerize prodllm-rag:latest
  #   docker compose --profile canary up
  #
  # The image is produced by `bentoml containerize`, not by a target in
  # docker/Dockerfile. BentoML generates its own Dockerfile from the Bento --
  # with the locked requirements the build resolved -- and hand-maintaining a
  # parallel one here would be a second, drifting definition of the same image.
  # So these services declare no `build:`; the two commands above are the
  # prerequisite, and `docker compose up` without the profile is unaffected.
  #
  # Both replicas mount the same read-only artifacts and differ only in
  # PRODLLM_RELEASE_CHANNEL. That is the point: a canary must differ from
  # stable in exactly one dimension, or a latency change cannot be attributed
  # to the thing being rolled out.
  bento: &bento
    profiles: ["canary", "bento"]
    image: prodllm-rag:latest
    environment: &bento-env
      PRODLLM_RELEASE_CHANNEL: stable
      PRODLLM_ARTIFACTS_DIR: /app/artifacts
      PRODLLM_LOG_LEVEL: INFO
      PRODLLM_TORCH_NUM_THREADS: "1"
      PRODLLM_TOP_K: "5"
      # 0 for anything being measured. A non-zero value paces the extractive
      # stream so the increments are visible in curl, which is a demo aid and
      # would otherwise be indistinguishable from real latency in a report.
      PRODLLM_STREAM_DEMO_DELAY_MS: "0"
    volumes:
      # Read-only, and shared between both replicas. The weights are 465 MB and
      # the index is DVC-tracked: baking either into the Bento would version the
      # artifact a second time inside every build. Neither replica can corrupt
      # what the other is serving.
      - ./artifacts:/app/artifacts:ro
    healthcheck:
      # BentoML serves /readyz itself, so this needs no application endpoint.
      # Readiness detail (documents indexed, which channel) is POST /status.
      test: ["CMD", "python", "-c", "import sys,urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/readyz', timeout=3); sys.exit(0)"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 3
    restart: unless-stopped

  # The canary replica. The YAML anchor above means it cannot drift from stable
  # by accident -- the override below is the complete list of what differs.
  bento-canary:
    <<: *bento
    profiles: ["canary"]
    environment:
      <<: *bento-env
      PRODLLM_RELEASE_CHANNEL: canary

  # The weighted splitter. 90% stable / 10% canary; see docker/canary-nginx.conf
  # for why those numbers and how the promotion and rollback steps work.
  #
  # Only this service publishes a port: during a rollout every request must go
  # through the split, or the measurement is of whichever replica the caller
  # happened to address.
  canary-router:
    profiles: ["canary"]
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./docker/canary-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      bento:
        condition: service_healthy
      bento-canary:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------- Module 3: the generative LLM
  #
  #   docker compose --profile vllm up -d vllm
  #   # then point the service at it and restart:
  #   PRODLLM_LLM_BASE_URL=http://localhost:8000/v1 PRODLLM_LLM_MODEL=Qwen/Qwen2.5-0.5B-Instruct
  #
  # vLLM exposes an OpenAI-compatible /chat/completions with SSE streaming,
  # which is the same wire format prodllm.streaming already speaks. So this is
  # a drop-in alternative to a hosted endpoint: only LLM_BASE_URL and
  # LLM_MODEL change, and no application code knows the difference.
  #
  # Behind a profile, and NOT the configured default. The measured numbers in
  # reports/module-3.md were taken with no LLM in the request path, and the
  # project's evaluation gate is pointed at a hosted endpoint -- so turning
  # this on changes what the latency figures mean, which is why it is an
  # explicit opt-in rather than part of `docker compose up`.
  #
  # The model is small on purpose. This machine's GPU has 4 GB of VRAM, so a
  # 0.5B model at fp16 (~1 GB of weights) is what leaves room for a KV cache;
  # a 1.5B model does not fit. A 0.5B model's Arabic legal reasoning is weak,
  # and that is a real limitation rather than a tuning problem -- see the
  # report. Serving infrastructure is what this profile demonstrates.
  vllm:
    profiles: ["vllm"]
    image: vllm/vllm-openai:v0.11.2
    ports:
      - "8000:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    command: >
      --model Qwen/Qwen2.5-0.5B-Instruct
      --dtype float16
      --max-model-len 8192
      --gpu-memory-utilization 0.85
      --served-model-name Qwen/Qwen2.5-0.5B-Instruct
    volumes:
      # Without a cache volume every restart re-downloads the weights.
      - hf-cache-vllm:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # vLLM loads the model, compiles CUDA graphs and profiles memory before it
    # answers, which is minutes on first start -- hence the long start_period.
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys,urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); sys.exit(0)"]
      interval: 20s
      timeout: 5s
      start_period: 600s
      retries: 5
    restart: unless-stopped

volumes:
  hf-cache:
  hf-cache-dev:
  hf-cache-vllm:
  # Holds mlflow.db and the logged artifacts. A named volume rather than a
  # bind mount: the run history is what makes the comparison auditable, and a
  # bind mount into a gitignored directory is one `git clean -xfd` away from
  # losing it.
  mlflow-store:
