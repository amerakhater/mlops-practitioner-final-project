# The canary traffic splitter.
#
# Used by the `canary` compose profile to put a weighted split in front of two
# Bento replicas, so a new release takes a small share of real traffic before
# it takes all of it.
#
# This is the mechanism a rollout needs, in the smallest form that actually
# runs locally. In a cluster the same shape is expressed as two Deployments
# behind one Service with the replica counts as the weights, or as an Istio
# VirtualService with explicit weights -- the reasoning in the README applies
# unchanged, because what matters is the ratio and what you measure during it.

upstream rag_backends {
    # 9:1. The weights ARE the rollout: shifting them is the promotion step,
    # and setting canary's weight to 0 (or stopping the container) is the
    # rollback -- no image rebuild, no redeploy of the stable replica.
    #
    # Why 10% rather than 50%: the point of a canary is to expose a fault to
    # as few callers as possible while still generating enough requests to see
    # it. At the ~27 req/s this service sustains on /ask, 10% is still ~2.7
    # req/s, which fills a p95 bucket in under a minute.
    server bento:3000        weight=9;
    server bento-canary:3000 weight=1;

    # Take a replica out of rotation after 3 failures in 30s rather than
    # letting every third caller hit a broken canary for the whole window.
    # This is nginx's own ejection, not a substitute for the health checks
    # compose runs -- it reacts in seconds, where a container restart does not.
    keepalive 32;
}

server {
    listen 8080;

    # A streamed answer must not be buffered here, or nginx accumulates the
    # whole body and hands the client one block at the end. That would not
    # break /ask, but it would silently destroy /ask_stream -- the endpoint
    # would still return the right bytes, just never incrementally, and the
    # only symptom is that curl stops printing progressively.
    proxy_buffering off;
    proxy_cache off;

    # Long enough for a streamed answer from a loaded generator. The Bento's
    # own traffic.timeout is 180s; these sit just above it so the backend is
    # what gives up first and the client gets the backend's error rather than
    # a bare 504 from the proxy.
    proxy_read_timeout 190s;
    proxy_send_timeout 190s;

    location / {
        proxy_pass http://rag_backends;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";

        # Which replica served this request. The response body already carries
        # `release_channel`, but that only helps for calls that reach the
        # application; this header is set by the proxy, so it is still present
        # on a 502 from a canary that crashed before it could answer -- which
        # is exactly the request you most want attributed.
        add_header X-Upstream $upstream_addr always;
    }
}
